name: Sponsors

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sponsors
  cancel-in-progress: true

jobs:
  update:
    name: Update sponsor graph
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Validate provider tokens
        run: |
          test -n "$SPONSORKIT_GITHUB_TOKEN" || { echo "SPONSORKIT_GITHUB_TOKEN is not configured"; exit 1; }
          test -n "$SPONSORKIT_PATREON_TOKEN" || { echo "SPONSORKIT_PATREON_TOKEN is not configured"; exit 1; }

      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Update sponsor graph
        env:
          SPONSORKIT_GITHUB_TOKEN: ${{ secrets.SPONSORKIT_GITHUB_TOKEN }}
          SPONSORKIT_PATREON_TOKEN: ${{ secrets.SPONSORKIT_PATREON_TOKEN }}
        run: bun run sponsors

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          add-paths: .github/sponsorkit/sponsors.svg
          branch: automation/sponsors
          commit-message: 'chore: update sponsors [skip ci]'
          title: 'chore: update sponsors'
          body: Automated SponsorKit graph update.
