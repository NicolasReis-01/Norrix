<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norrix inline editor geometry</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        font: 14px sans-serif;
      }

      .absolute {
        position: absolute;
      }

      .inset-0 {
        inset: 0;
      }

      .pointer-events-none {
        pointer-events: none;
      }

      .pointer-events-auto {
        pointer-events: auto;
      }

      .overflow-hidden {
        overflow: hidden;
      }

      .overflow-visible {
        overflow: visible;
      }

      .z-20 {
        z-index: 20;
      }

      .resize-none {
        resize: none;
      }

      .border-0 {
        border: 0;
      }

      .p-0 {
        padding: 0;
      }

      .outline-none {
        outline: none;
      }

      .box-border {
        box-sizing: border-box;
      }

      .bg-transparent {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./inline-editor-geometry.tsx"></script>
  </body>
</html>
